<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - {{author}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f5f5;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            margin: 5px 0;
            opacity: 0.9;
        }

        .header .meta {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 15px;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1a1a1a;
                color: #e0e0e0;
            }
            .header {
                background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>{{title}}</h1>
        <p>by {{author}}</p>
        <div class="meta">
            <p>Published on {{date}}</p>
            <p>AI Newsletter System v1.0</p>
        </div>
    </header>

    <div class="content-wrapper">
        {{content}}
    </div>
</body>
</html>
